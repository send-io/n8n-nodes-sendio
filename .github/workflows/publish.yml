# Publishes n8n-nodes-sendio to npm when a v* tag lands on this mirror.
# n8n requires community nodes to be published from GitHub Actions with npm
# provenance, which is why this runs here and not from the GitLab source repo.
# Needs the repository secret NPM_TOKEN (an npm automation token with publish
# rights on the package).

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_MODE: 'true' # prepublishOnly (n8n-node prerelease) refuses to publish without it
