# Publishes n8n-nodes-sendio to npm when a v* tag lands on this mirror.
# n8n requires community nodes to be published from GitHub Actions with npm
# provenance, which is why this runs here and not from the GitLab source repo.
# No token: the package's npm settings list this repository and workflow as a
# trusted publisher (OIDC), which also attaches provenance on its own.

name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # npm provenance
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm install -g npm@latest # trusted publishing needs npm 11.5.1 or later
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm publish --access public
        env:
          RELEASE_MODE: 'true' # prepublishOnly (n8n-node prerelease) refuses to publish without it
      - run: npx --yes @n8n/scan-community-package n8n-nodes-sendio # n8n's scanner, against what npm now serves
