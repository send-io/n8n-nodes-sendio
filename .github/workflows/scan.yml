# Runs n8n's community package scanner against the version on npm.
# Lives here because the scanner's isolated-vm dependency does not build on a
# recent macOS Node; publish.yml runs the same step after every release.
#   gh workflow run scan.yml --repo send-io/n8n-nodes-sendio

name: Scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes @n8n/scan-community-package n8n-nodes-sendio
